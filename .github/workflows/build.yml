name: Build NEW DUBAI APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout source code
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'
      cache: gradle

  - name: Set up Android SDK
    uses: android-actions/setup-android@v4
    with:
      packages: 'platform-tools'
      accept-android-sdk-licenses: 'yes'

  - name: Install required Android packages
    run: |
      sdkmanager --install \
        "platforms;android-34" \
        "build-tools;34.0.0"

  - name: Set up Gradle 8.7
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.7'

  - name: Run unit tests
    run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

  - name: Build APK
    run: gradle :app:assembleDebug --no-daemon --stacktrace

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: NEW-DUBAI-APK
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 7
