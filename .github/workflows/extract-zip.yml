name: Extract NEW DUBAI ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP_FILE="NEW_DUBAI_ATELIER_SIGNATURE_v1.4.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found!"
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted
          cp -a extracted/. .
          rm -rf extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset -- .github/workflows/build.yml

          git commit -m "Extract NEW DUBAI project files" || echo "No changes"
          git push
